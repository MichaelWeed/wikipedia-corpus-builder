[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corpussieve"
version = "0.1.0.dev0"
description = "Deterministic domain-specific Wikitext corpus compiler"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "CorpusSieve contributors" }
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "zstandard>=0.22",
    "mwparserfromhell>=0.6",
    "platformdirs>=4",
    "keyring>=25",
    "send2trash>=1.8",
]

[project.scripts]
corpussieve = "corpussieve.cli.main:app_entry"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx",
]
packaging = [
    "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corpussieve"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "TID"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.remove".msg = "Deletion APIs are forbidden outside corpussieve.safety (P7 invariant)."
"os.unlink".msg = "Deletion APIs are forbidden outside corpussieve.safety (P7 invariant)."
"shutil.rmtree".msg = "Deletion APIs are forbidden outside corpussieve.safety (P7 invariant). Use # noqa: TID251 with justification for staging cleanup."
"send2trash.send2trash".msg = "Deletion APIs are forbidden outside corpussieve.safety (P7 invariant)."

[tool.ruff.lint.per-file-ignores]
"src/corpussieve/safety/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
