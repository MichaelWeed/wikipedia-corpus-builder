name: Desktop Application CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  desktop-tests:
    name: Desktop Shell Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check for desktop package
        id: check_desktop
        run: |
          if [ ! -f "apps/desktop/package.json" ]; then
            echo "::notice ::apps/desktop/package.json does not exist yet (P6 scaffold pending). Skipping desktop build."
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install pnpm & Node
        if: steps.check_desktop.outputs.EXISTS == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.check_desktop.outputs.EXISTS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'apps/desktop/pnpm-lock.yaml'

      - name: Install Rust toolchain
        if: steps.check_desktop.outputs.EXISTS == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        if: steps.check_desktop.outputs.EXISTS == 'true'
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        if: steps.check_desktop.outputs.EXISTS == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tauri v2 on Linux links against webkit2gtk/libsoup/appindicator at
      # build time; these aren't preinstalled on ubuntu-latest runners.
      # libappindicator3-dev and libayatana-appindicator3-dev conflict with
      # each other (verified via a real CI failure: "E: Unable to correct
      # problems, you have held broken packages") -- only the latter
      # (Tauri v2's currently documented package) is installed.
      - name: Install Linux system dependencies (Tauri)
        if: steps.check_desktop.outputs.EXISTS == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev

      - name: Desktop Lint & Test
        if: steps.check_desktop.outputs.EXISTS == 'true'
        run: |
          pnpm -C apps/desktop install
          pnpm -C apps/desktop lint
          pnpm -C apps/desktop test

      - name: Desktop Build (vite)
        # tauri.conf.json's build.frontendDist ("../dist") must exist before
        # ANY cargo invocation that runs the tauri-build build script (check/
        # test/build alike) -- generate_context!() panics otherwise. Verified
        # via a real CI failure ("frontendDist ... doesn't exist", proc macro
        # panicked at main.rs:12). `tauri build`'s own beforeBuildCommand hook
        # would produce this automatically, but bare `cargo check`/`cargo
        # test` below don't go through the Tauri CLI at all, so it must be
        # built explicitly first.
        if: steps.check_desktop.outputs.EXISTS == 'true'
        run: pnpm -C apps/desktop build

      - name: Build engine sidecar (PyInstaller)
        # tauri.conf.json declares bundle.externalBin (P6.2 packaging) --
        # Tauri's build script fails any cargo build, including `cargo
        # check`, if this binary is missing. Runs natively per matrix OS
        # since PyInstaller does not cross-compile.
        if: steps.check_desktop.outputs.EXISTS == 'true'
        shell: bash
        run: engine/scripts/build_sidecar.sh

      - name: Rust Compile Check
        if: steps.check_desktop.outputs.EXISTS == 'true'
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Rust Tests
        # Exercises the bundled sidecar for real: spawns it and completes an
        # engine.hello round trip over its stdio (see engine.rs's tests).
        if: steps.check_desktop.outputs.EXISTS == 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Tauri Debug Build
        if: steps.check_desktop.outputs.EXISTS == 'true'
        run: pnpm -C apps/desktop tauri build --debug
